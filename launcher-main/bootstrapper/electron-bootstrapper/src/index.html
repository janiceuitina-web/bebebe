<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RobBob Launcher - Установка</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .container {
      width: 500px;
      height: 450px;
      background: linear-gradient(135deg, #0a0b0f 0%, #1a1b2e 50%, #0a0b0f 100%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    .container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(168,85,247,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(34,197,94,0.1) 0%, transparent 50%);
      animation: bgPulse 4s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Header */
    .header {
      position: relative;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow:
        0 0 30px rgba(255,255,255,0.8),
        0 0 60px rgba(168,85,247,0.6);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }

    /* Close button */
    .close-btn {
      -webkit-app-region: no-drag;
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .close-btn:hover {
      background: rgba(239,68,68,0.2);
      color: #ef4444;
    }

    /* Content area */
    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 20px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Screens */
    .screen {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .screen.active {
      display: flex;
    }

    /* Path selection screen */
    .path-info {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
    }

    .path-label {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 12px;
    }

    .path-display {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 12px 16px;
      color: rgba(255,255,255,0.9);
      font-family: 'Consolas', monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 12px;
    }

    .btn {
      -webkit-app-region: no-drag;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #c084fc);
      color: #fff;
      box-shadow: 0 4px 20px rgba(168,85,247,0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(168,85,247,0.5);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255,255,255,0.1);
      border-color: rgba(168,85,247,0.5);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    /* Progress screen */
    .progress-info {
      text-align: center;
    }

    .status-text {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      margin-bottom: 20px;
      min-height: 24px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #22c55e);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-percent {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
    }

    /* Loading animation */
    .loading-animation {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
    }

    .loading-dot {
      width: 10px;
      height: 10px;
      background: #a855f7;
      border-radius: 50%;
      animation: loadingBounce 1.4s infinite ease-in-out both;
    }

    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes loadingBounce {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Error screen */
    .error-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #fff;
    }

    .error-message {
      color: #ef4444;
      font-size: 15px;
      text-align: center;
      margin-bottom: 24px;
    }

    /* Success screen */
    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #fff;
    }

    .success-message {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      text-align: center;
      margin-bottom: 12px;
    }

    .success-submessage {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      text-align: center;
    }

    /* Version */
    .version {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="close-btn" id="closeBtn">✕</button>
    
    <div class="header">
      <div class="logo">ROBBOB</div>
      <div class="subtitle">Установка лаунчера</div>
    </div>

    <div class="content">
      <!-- Path selection screen -->
      <div class="screen active" id="pathScreen">
        <div class="path-info">
          <div class="path-label">Выберите папку для установки:</div>
          <div class="path-display" id="pathDisplay">Загрузка...</div>
          <div class="button-group">
            <button class="btn btn-secondary" id="selectPathBtn" style="flex: 1;">Изменить папку</button>
          </div>
        </div>
        <button class="btn btn-primary" id="installBtn">Установить</button>
      </div>

      <!-- Progress screen -->
      <div class="screen" id="progressScreen">
        <div class="progress-info">
          <div class="loading-animation">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
          </div>
          <div class="status-text" id="statusText">Подготовка...</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-percent" id="progressPercent">0%</div>
        </div>
      </div>

      <!-- Error screen -->
      <div class="screen" id="errorScreen">
        <div class="error-icon">✕</div>
        <div class="error-message" id="errorMessage">Произошла ошибка</div>
        <button class="btn btn-primary" id="retryBtn">Попробовать снова</button>
      </div>

      <!-- Success screen -->
      <div class="screen" id="successScreen">
        <div class="success-icon">✓</div>
        <div class="success-message" id="successMessage">Установка завершена!</div>
        <div class="success-submessage" id="successSubmessage">Вы можете запустить лаунчер с ярлыка на рабочем столе "RobBob Launcher"</div>
        <button class="btn btn-primary" id="closeAfterSuccessBtn" style="margin-top: 20px;">Закрыть</button>
      </div>
    </div>

    <div class="version">v1.0.0</div>
  </div>

  <script>
    // UI Elements
    const closeBtn = document.getElementById('closeBtn');
    const pathDisplay = document.getElementById('pathDisplay');
    const selectPathBtn = document.getElementById('selectPathBtn');
    const installBtn = document.getElementById('installBtn');
    const retryBtn = document.getElementById('retryBtn');
    
    const pathScreen = document.getElementById('pathScreen');
    const progressScreen = document.getElementById('progressScreen');
    const errorScreen = document.getElementById('errorScreen');
    const successScreen = document.getElementById('successScreen');
    
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const errorMessage = document.getElementById('errorMessage');
    
    let currentPath = null;

    // Show specific screen
    function showScreen(screenName) {
      pathScreen.classList.remove('active');
      progressScreen.classList.remove('active');
      errorScreen.classList.remove('active');
      successScreen.classList.remove('active');
      
      switch(screenName) {
        case 'path':
          pathScreen.classList.add('active');
          break;
        case 'progress':
          progressScreen.classList.add('active');
          break;
        case 'error':
          errorScreen.classList.add('active');
          break;
        case 'success':
          successScreen.classList.add('active');
          break;
      }
    }

    // Update progress
    function updateProgress(percent, status) {
      progressFill.style.width = percent + '%';
      progressPercent.textContent = percent + '%';
      if (status) {
        statusText.textContent = status;
      }
    }

    // Load default path on init
    window.bootstrapper.onInit((data) => {
      currentPath = data.defaultPath;
      pathDisplay.textContent = currentPath;
    });

    // Listen for status updates
    window.bootstrapper.onStatusUpdate((data) => {
      if (data.type === 'status') {
        showScreen('progress');
        statusText.textContent = data.message;
        if (data.progress !== undefined) {
          updateProgress(data.progress, data.message);
        }
      } else if (data.type === 'complete') {
        showScreen('success');
        const successMessage = document.getElementById('successMessage');
        const successSubmessage = document.getElementById('successSubmessage');
        if (successMessage) successMessage.textContent = data.message || 'Установка завершена!';
        if (successSubmessage && data.message) {
          // Extract submessage from the full message
          const lines = data.message.split('\n');
          if (lines.length > 1) {
            successMessage.textContent = lines[0];
            successSubmessage.textContent = lines.slice(1).join('\n');
          }
        }
        if (data.progress !== undefined) {
          updateProgress(data.progress);
        }
      } else if (data.type === 'error') {
        showScreen('error');
        errorMessage.textContent = data.message;
      }
    });

    // Select custom path
    selectPathBtn.addEventListener('click', async () => {
      const result = await window.bootstrapper.selectInstallPath();
      if (result.success) {
        currentPath = result.path;
        pathDisplay.textContent = currentPath;
      }
    });

    // Start installation
    installBtn.addEventListener('click', () => {
      showScreen('progress');
      updateProgress(0, 'Начало установки...');
      window.bootstrapper.startInstall(currentPath);
    });

    // Retry installation
    retryBtn.addEventListener('click', () => {
      showScreen('progress');
      updateProgress(0, 'Повторная попытка...');
      window.bootstrapper.retry();
    });

    // Close window
    closeBtn.addEventListener('click', () => {
      window.bootstrapper.close();
    });
    
    // Close after successful installation
    const closeAfterSuccessBtn = document.getElementById('closeAfterSuccessBtn');
    if (closeAfterSuccessBtn) {
      closeAfterSuccessBtn.addEventListener('click', () => {
        window.bootstrapper.close();
      });
    }
  </script>
</body>
</html>
